run_name: opportunity_quality_regularized_attention_fast
seed: 42
device: cpu
data_dir: data/processed/opportunity_window_quality
output_dir: outputs
models:
  - fixed_fusion
  - attention_fusion
  - quality_regularized_attention_fusion
  - quality_fusion
model:
  hidden_dim: 48
  quality_power: 0.5
training:
  batch_size: 512
  epochs: 8
  learning_rate: 0.001
  quality_loss_weight: 0.5
  attention_quality_loss_weight: 0.1
  num_workers: 0
abstention:
  confidence_threshold: 0.45
  mean_quality_threshold: 0.35
